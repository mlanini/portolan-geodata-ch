# geodata.ch — catalog-level manifest (single source of truth)
#
# The generator (tools/generate_catalog.py) reads this file plus datasets.yaml
# and emits the whole STAC tree, every README.md and AGENTS.md, and the MapLibre
# style files. Edit metadata here, never in the generated files, so prose and
# machine metadata cannot drift (see specs/best-practices/documentation.md in
# portolan-spec).
#
# Values marked "verify: pipeline" are placeholders that the build pipeline
# (tools/harvest_stac.py) replaces with harvested truth when run inside the
# Swiss Federal network, where data.geo.admin.ch and geocat.ch are reachable
# through the proxy. This sandbox cannot reach those hosts, so nothing derived
# from live bytes (bbox statistics, checksums, row counts, item footprints) is
# invented here.

catalog:
  id: geodata-ch
  title: "geodata.ch — Swiss Federal Geodata, Cloud-Native"
  description: >-
    geodata.ch is a cloud-native mirror of open geodata from the Swiss Federal
    Spatial Data Infrastructure (BGDI). It republishes a curated set of swisstopo
    and other federal datasets as GeoParquet, PMTiles, and Cloud-Optimized
    GeoTIFF so a person or an agent can query them directly from object storage
    with no server in between. Every collection links back to the authoritative
    swisstopo source and its original FileGDB, GeoPackage, and INTERLIS (XTF)
    downloads.
  # Canonical hosting location. AWS Zurich region (eu-central-2) sits closest to
  # the data's audience; adjust if the ch-geodata bucket is created elsewhere.
  base_url: "https://ch-geodata.s3.eu-central-2.amazonaws.com"
  s3_base: "s3://ch-geodata"
  s3_arn: "arn:aws:s3:::ch-geodata"
  updated: "2026-09-17T00:00:00Z"

  # Portolan STAC extension schema URI = the single signal of spec version.
  portolan_ext: "https://schemas.portolan-sdi.org/portolan/v0.2.0/schema.json"

  # Extension schema URIs pinned by version (see portolan-spec stac/ profile).
  extensions:
    web_map_links: "https://stac-extensions.github.io/web-map-links/v1.3.0/schema.json"
    table: "https://stac-extensions.github.io/table/v1.2.0/schema.json"
    alternate: "https://stac-extensions.github.io/alternate-assets/v1.2.0/schema.json"
    version: "https://stac-extensions.github.io/version/v1.2.0/schema.json"

  # Single blanket data license applied to every collection. swisstopo open
  # government data is free of charge; use requires citing the source. No SPDX
  # identifier captures those exact terms, so Portolan's "other" plus a license
  # link is used uniformly (core.md — License).
  license: "other"
  license_href: "https://www.swisstopo.admin.ch/en/terms-of-use-free-geodata"
  license_title: "swisstopo — free geodata, free use with source citation"

  # This is a MIRROR catalog: swisstopo (and BFS) produce the data, geodata.ch
  # hosts a cloud-native copy. Producer and host differ, so each collection
  # carries a `via` link to the source page and a `canonical` link to the source
  # STAC where one exists (core.md — Source Provenance).
  host_provider:
    name: "geodata.ch"
    roles: ["processor", "host"]
    url: "https://geodata.ch"
    email: "info@geodata.ch"

  # National WGS84 bounding box of Switzerland (incl. Liechtenstein data extent).
  # Used as the catalog extent and as the collection extent for nationwide
  # datasets. Per-item footprints are produced by the pipeline, not guessed here.
  extent_ch: [5.956, 45.818, 10.492, 47.808]

  # STAC API root of the Swiss Federal Spatial Data Infrastructure.
  bgdi_stac_root: "https://data.geo.admin.ch/api/stac/v0.9"

# Thematic sub-catalogs. Collections stay one level deep under these (core.md —
# Nested Catalogs, Flat Collections).
subcatalogs:
  - id: topography
    title: "Topography & Landscape"
    description: >-
      The national topographic landscape models, geographical names, land cover,
      and 3D buildings that describe the physical and built landscape of
      Switzerland.
  - id: boundaries
    title: "Boundaries & Administrative Units"
    description: >-
      Administrative boundaries, localities and postal codes, and the official
      register of Swiss municipalities that keys them together.
  - id: terrain-imagery
    title: "Terrain & Imagery"
    description: >-
      Nationwide elevation and orthophoto coverage, published as Cloud-Optimized
      GeoTIFF scene collections.
